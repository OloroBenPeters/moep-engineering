<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 360" width="1260" height="360">
  <!-- Hexagonal Mark on Left -->
  <g transform="translate(25, 18) scale(0.58)">
    <g fill="#F0E7D9" stroke="none">
      <!-- Top Roof Chevron -->
      <path d="M 256,24 L 412,114 L 412,144 L 256,54 L 142,120 L 142,90 Z" />

      <!-- Center 'M' Vertical Column -->
      <rect x="242" y="54" width="28" height="200" />

      <!-- Left 'M' Upper Leg -->
      <path d="M 142,90 L 170,106 L 170,225 L 142,225 Z" />

      <!-- Upper Right 'E' Structure -->
      <rect x="300" y="118" width="28" height="174" />
      <rect x="300" y="118" width="112" height="28" />
      <rect x="300" y="191" width="78" height="26" />
      <rect x="300" y="264" width="132" height="28" />
      <rect x="412" y="118" width="26" height="174" />

      <!-- Center 'O' Circular Torus Ring -->
      <path fill-rule="evenodd" d="M 256,268 A 74,74 0 1,0 256,416 A 74,74 0 1,0 256,268 Z M 256,296 A 46,46 0 1,1 256,388 A 46,46 0 1,1 256,296 Z" />

      <!-- Lower Left Parallelogram Block -->
      <path fill-rule="evenodd" d="M 74,188 L 152,233 L 152,425 L 74,380 Z M 102,240 L 124,253 L 124,357 L 102,344 Z" />

      <!-- 'P' Vertical Lower Leg -->
      <rect x="356" y="292" width="28" height="138" />

      <!-- Bottom Slanted Base -->
      <path d="M 152,396 L 256,456 L 256,484 L 152,425 Z" />
      <path d="M 384,407 L 256,484 L 256,456 L 356,392 Z" />
      <path d="M 384,407 L 432,292 L 404,292 L 356,407 Z" />
    </g>
  </g>

  <!-- Typography Wordmark on Right -->
  <g transform="translate(340, 20)">
    <!-- MOEP primary brand title -->
    <text x="0" y="128" fill="#F0E7D9" font-family="Liberation Sans, Montserrat, sans-serif" font-weight="900" font-size="122" letter-spacing="16">MOEP</text>
    
    <!-- ENGINEERING SERVICES -->
    <text x="4" y="208" fill="#F0E7D9" font-family="Liberation Sans, Montserrat, sans-serif" font-weight="700" font-size="42" letter-spacing="8">ENGINEERING SERVICES</text>
    
    <!-- LIMITED -->
    <text x="6" y="268" fill="#F0E7D9" fill-opacity="0.85" font-family="Liberation Sans, Montserrat, sans-serif" font-weight="600" font-size="34" letter-spacing="13">LIMITED</text>

    <!-- Structural Accent Line in Yellow -->
    <rect x="4" y="292" width="120" height="5" fill="#FBC215" />
  </g>
</svg>